<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>IDIOT ESCAPE</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0d;color:#e8e9e9;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}button,input{font:inherit;border-radius:0}button{cursor:pointer;border:1px solid #687079;background:#222831;color:#fff;padding:11px 14px;font-weight:700}button:active{background:#a63a39}input{background:#11161c;color:#fff;border:1px solid #69717b;padding:12px;min-width:0}#game{position:fixed;inset:0}#menu{position:fixed;inset:0;background:linear-gradient(125deg,#070a0de8,#1b1e25e9);z-index:20;display:flex;justify-content:center;align-items:center;padding:15px}#menuBox{width:min(440px,100%);border-top:5px solid #ad3837;background:#14191eea;padding:28px;box-shadow:0 10px 45px #000a}h1{font-size:clamp(35px,8vw,54px);margin:0 0 6px;letter-spacing:2px}#menuBox p{font-size:12px;color:#a4adb6;margin:0 0 24px}#menuBox input{width:100%;margin:7px 0}#menuBox button{width:100%;margin-top:8px}#menuBox .red{background:#8e302f;border-color:#bd4a48}#menuError{color:#ff7676;min-height:18px;font-size:13px;margin-top:10px}#hud{position:fixed;inset:0;pointer-events:none;display:none}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{background:#111820d9;border-left:3px solid #ae3535;padding:9px 12px;font-size:12px}#roomLabel{font-weight:900}#members{max-width:260px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#chatArea{position:absolute;left:12px;bottom:16px;width:min(330px,60vw);pointer-events:auto}#messages{max-height:130px;overflow-y:auto;background:#0d1218a8;font-size:12px;padding:7px;min-height:30px;word-break:break-word}#chatRow{display:flex}#chatInput{width:100%;font-size:13px;padding:9px}#chatSend{padding:8px}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:#ffffff9a}#hint{position:absolute;top:64px;left:12px;font-size:11px;color:#e1e1e1;background:#0d1218a8;padding:7px}#hp{position:absolute;right:12px;top:12px;background:#111820d9;border-bottom:3px solid #a33b3b;padding:10px;font-size:13px}#mobile{display:none;position:absolute;inset:0;pointer-events:none}#stickBase{position:absolute;bottom:72px;left:24px;width:130px;height:130px;border:2px solid #ffffff65;background:#ffffff12;border-radius:50%;pointer-events:auto;touch-action:none}#stickKnob{position:absolute;width:55px;height:55px;left:36px;top:36px;border-radius:50%;background:#d4dbe066;border:2px solid #fff8}#mobileButtons{position:absolute;right:22px;bottom:82px;display:flex;gap:12px;align-items:end;pointer-events:auto}#mobileButtons button{width:65px;height:65px;border:1px solid #fff8;background:#1e293bdc;font-size:12px}#mobileButtons #attack{background:#8b2d30e8;width:75px;height:75px}#chatToggle{position:absolute;right:12px;top:64px;pointer-events:auto}#toast{position:absolute;left:50%;top:25%;transform:translateX(-50%);background:#0d1218e8;border:1px solid #a43d3d;padding:10px;display:none;white-space:nowrap;font-size:13px}@media(pointer:coarse){#mobile{display:block}#chatArea{bottom:5px;left:8px;width:min(300px,65vw)}#hint{display:none}#crosshair{display:none}#chatArea:not(.show) #chatRow{display:none}#chatArea:not(.show) #messages{display:none}}@media(max-width:500px){#members{max-width:125px}#top{right:85px}#hp{top:56px}}
</style></head><body><div id="game"></div><div id="menu"><div id="menuBox"><h1>IDIOT<br>ESCAPE</h1><p>MULTIPLAYER PRISON ESCAPE · PROTOTYPE 01</p><input id="name" maxlength="16" placeholder="플레이어 이름" value="PRISONER"><button class="red" id="create">방 만들기</button><input id="code" inputmode="numeric" maxlength="6" placeholder="6자리 방 코드"><button id="join">방 참가</button><div id="menuError"></div></div></div><div id="hud"><div id="top"><div class="panel" id="roomLabel">ROOM ------</div><div class="panel" id="members">PLAYERS</div><div class="panel">ALERT LEVEL 01</div></div><div id="hp">HP 100</div><div id="hint">WASD 이동 · 마우스 시점 · SHIFT 달리기 · SPACE 점프 · 클릭 공격 · T 채팅 · ESC 커서 해제</div><div id="crosshair">+</div><div id="toast"></div><div id="chatArea"><div id="messages"></div><div id="chatRow"><input id="chatInput" maxlength="140" placeholder="채팅 입력 (T)"><button id="chatSend">전송</button></div></div><button id="chatToggle">CHAT</button><div id="mobile"><div id="stickBase"><div id="stickKnob"></div></div><div id="mobileButtons"><button id="jump">JUMP</button><button id="attack">HIT</button></div></div></div>
<script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),socket=io(),mobile=matchMedia('(pointer:coarse)').matches;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x171e27);scene.fog=new THREE.Fog(0x171e27,22,78);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.08,110);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x91add4,0x293039,2.1));const sun=new THREE.DirectionalLight(0xf1e4ca,2.5);sun.position.set(12,25,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const concrete=mat(0x60666a),floorMat=mat(0x444a50),bars=mat(0x1b232c),doorMat=mat(0x7a3334),metal=mat(0x89949b),grass=mat(0x374c40);
const solid=[];function box(x,y,z,w,h,d,m,collision=true){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);if(collision)solid.push({x,z,w,d});return mesh;}
box(0,-.3,0,78,.6,78,floorMat,false);box(0,.01,-21,78,.05,36,grass,false);
// Prison boundary and interior, with three distinct exit landmarks for future missions.
box(-24,2,0,1,4,48,concrete);box(24,2,0,1,4,48,concrete);box(0,2,-24,48,4,1,concrete);box(-14,2,24,20,4,1,concrete);box(14,2,24,20,4,1,concrete);
box(0,2,18,1,4,11,concrete);box(0,2,1,1,4,12,concrete);
for(let side of [-1,1])for(let i=0;i<4;i++){
 const x=side*7.5,z=14-i*7;box(x,2,z-3.1,13,4,.6,concrete);box(side*14,2,z,0.6,4,6.5,concrete);
 for(let b=0;b<6;b++)box(side*(1.3+b*.65),1.6,z+3.1,.09,3.2,.1,bars);
 box(side*9,.35,z-1.4,3,.7,1.6,metal);box(side*9,.85,z-1.9,3,.3,.6,concrete);
}
box(-13,2,-10,10,4,.8,concrete);box(-18,2,-15,.8,4,10,concrete);box(-18,2,-5,.8,4,10,concrete);box(-13,4,-10,10,.3,10,concrete,false);
for(let x=-22;x<=22;x+=4)for(let z=-22;z<=22;z+=4){if((x+z)%8===0){const light=new THREE.PointLight(0xffd7a3,.5,7);light.position.set(x,3.8,z);scene.add(light);}}
box(-4,1.4,-23.3,3,2.8,.2,doorMat,false);box(0,1.4,23.7,3,2.8,.2,doorMat,false);box(23.3,1.4,-6,.2,2.8,3,doorMat,false);
for(let i=0;i<8;i++)box(-19+i*5,.6,-18,1.8,1.2,1.8,concrete);
const players=new Map();let me=null,active=false,velY=0,yaw=0,pitch=.2,keys={},stick={x:0,y:0},last=performance.now(),lastSend=0,lastAttack=0;
const colors=[0xe28c35,0xd16c30,0xf1a64a,0xb86b3b,0xd8a04d,0xc97839,0xe3a15c,0xbb7b4b];
function character(data){const root=new THREE.Group();scene.add(root);const orange=mat(colors[data.color%8]||colors[0]),skin=mat(0xf3c49d),dark=mat(0x22252a),white=mat(0xeee8df);
 function part(geo,m,x,y,z,parent=root){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;}
 part(new THREE.BoxGeometry(.75,.7,.42),orange,0,.91,0);part(new THREE.BoxGeometry(.85,.2,.45),orange,0,.58,0);
 const head=part(new THREE.SphereGeometry(.53,16,12),skin,0,1.65,0);head.scale.set(1.1,1.04,.95);
 for(const x of [-.2,.2]){part(new THREE.SphereGeometry(.065,8,8),dark,x,1.72,.49);part(new THREE.SphereGeometry(.025,8,8),white,x-.015,1.74,.54);}
 const arms=[],legs=[];for(const x of [-.53,.53])arms.push(part(new THREE.BoxGeometry(.23,.57,.28),orange,x,.97,0));for(const x of [-.22,.22])legs.push(part(new THREE.BoxGeometry(.28,.55,.3),orange,x,.28,0));
 const label=document.createElement('canvas');label.width=256;label.height=64;const ctx=label.getContext('2d');ctx.fillStyle='#13171de8';ctx.fillRect(0,0,256,64);ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText(data.name||'PRISONER',128,40);const texture=new THREE.CanvasTexture(label);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false}));sprite.position.y=2.65;sprite.scale.set(2.3,.58,1);root.add(sprite);
 root.position.set(data.x||0,data.y||0,data.z||0);root.rotation.y=data.rot||0;return {root,arms,legs,hp:100,downUntil:0,target:{x:root.position.x,y:root.position.y,z:root.position.z,rot:root.rotation.y},walk:0};}
function addPlayer(p){if(players.has(p.id))return;players.set(p.id,character(p));updateMembers();}
function updateMembers(){$('members').textContent=`PLAYERS ${players.size}/8`;}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300);}
socket.on('joined',d=>{me=d.id;active=true;players.forEach(p=>scene.remove(p.root));players.clear();d.players.forEach(addPlayer);$('menu').style.display='none';$('hud').style.display='block';$('roomLabel').textContent=`ROOM ${d.code} · COPY`;toast('방 코드 '+d.code+' · 친구에게 공유하세요');});
socket.on('playerJoined',p=>{addPlayer(p);toast(p.name+' 입장');});socket.on('playerLeft',id=>{const p=players.get(id);if(p)scene.remove(p.root);players.delete(id);updateMembers();});
socket.on('playerMoved',d=>{const p=players.get(d.id);if(p&&d.id!==me)p.target={x:d.x,y:d.y,z:d.z,rot:d.rot};});
socket.on('hit',d=>{const p=players.get(d.id);if(p){p.hp=d.hp;p.downUntil=d.until;if(d.id===me)$('hp').textContent='HP '+d.hp;}});
socket.on('respawn',d=>{const p=players.get(d.id);if(p){p.root.position.set(d.x,d.y,d.z);p.target={x:d.x,y:d.y,z:d.z,rot:d.rot};p.hp=d.hp;p.downUntil=0;if(d.id===me){velY=0;$('hp').textContent='HP 100';}}});
socket.on('punchEffect',d=>{const p=players.get(d.id);if(p)p.arms[1].rotation.x=-1.5;});
socket.on('errorMessage',msg=>$('menuError').textContent=msg);
socket.on('chat',d=>{const line=document.createElement('div');line.textContent=`${d.name}: ${d.message}`;$('messages').appendChild(line);while($('messages').children.length>30)$('messages').firstChild.remove();$('messages').scrollTop=$('messages').scrollHeight;});
$('create').onclick=()=>socket.emit('createRoom',{name:$('name').value});$('join').onclick=()=>socket.emit('joinRoom',{code:$('code').value,name:$('name').value});$('roomLabel').onclick=()=>{};$('roomLabel').style.pointerEvents='auto';$('roomLabel').addEventListener('click',()=>navigator.clipboard?.writeText($('roomLabel').textContent.match(/\d{6}/)?.[0]||''));
function chatSend(){const msg=$('chatInput').value.trim();if(msg)socket.emit('chat',msg);$('chatInput').value='';$('chatInput').blur();$('chatArea').classList.remove('show');}$('chatSend').onclick=chatSend;$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();chatSend();}});$('chatToggle').onclick=()=>$('chatArea').classList.toggle('show');
function typing(){return document.activeElement?.tagName==='INPUT';}
addEventListener('keydown',e=>{if(typing())return;keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='KeyT'&&active){$('chatArea').classList.add('show');$('chatInput').focus();}});addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(active&&!mobile&&!typing())renderer.domElement.requestPointerLock?.();});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.003;pitch=THREE.MathUtils.clamp(pitch+e.movementY*.0025,-.6,1.1);}});
function attack(){if(!active||Date.now()-lastAttack<450)return;lastAttack=Date.now();socket.emit('punch');}addEventListener('mousedown',e=>{if(e.button===0&&document.pointerLockElement===renderer.domElement)attack();});
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack();});$('jump').addEventListener('pointerdown',e=>{e.preventDefault();keys.Space=true;setTimeout(()=>keys.Space=false,150);});
const base=$('stickBase'),knob=$('stickKnob');let stickPointer=null;base.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;base.setPointerCapture(e.pointerId);moveStick(e);});base.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)moveStick(e);});function moveStick(e){const r=base.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),scale=Math.min(1,52/(Math.hypot(dx,dy)||1));stick.x=dx*scale/52;stick.y=dy*scale/52;knob.style.transform=`translate(${dx*scale}px,${dy*scale}px)`;}function resetStick(){stickPointer=null;stick.x=stick.y=0;knob.style.transform='translate(0,0)';}base.addEventListener('pointerup',resetStick);base.addEventListener('pointercancel',resetStick);
let lookPointer=null,lookX=0,lookY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(mobile&&e.clientX>innerWidth*.36){lookPointer=e.pointerId;lookX=e.clientX;lookY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}});renderer.domElement.addEventListener('pointermove',e=>{if(mobile&&e.pointerId===lookPointer){yaw-=(e.clientX-lookX)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lookY)*.005,-.6,1.1);lookX=e.clientX;lookY=e.clientY;}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null;});
function collide(x,z){const radius=.34;for(const b of solid){if(x+radius>b.x-b.w/2&&x-radius<b.x+b.w/2&&z+radius>b.z-b.d/2&&z-radius<b.z+b.d/2)return true;}return false;}
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;const self=players.get(me);
 if(self&&active){const down=Date.now()<self.downUntil;const mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+stick.x,mz=(keys.KeyW?1:0)-(keys.KeyS?1:0)-stick.y;const length=Math.hypot(mx,mz);const speed=keys.ShiftLeft?7.4:4.5;const sx=length?mx/Math.max(1,length):0,sz=length?mz/Math.max(1,length):0;
 const dx=(Math.cos(yaw)*sx-Math.sin(yaw)*sz)*speed*dt,dz=(-Math.sin(yaw)*sx-Math.cos(yaw)*sz)*speed*dt;
 if(!down){if(!collide(self.root.position.x+dx,self.root.position.z))self.root.position.x+=dx;if(!collide(self.root.position.x,self.root.position.z+dz))self.root.position.z+=dz;}
 if(keys.Space&&self.root.position.y<.015&&!down)velY=6.2;velY-=17*dt;self.root.position.y=Math.max(0,self.root.position.y+velY*dt);if(self.root.position.y===0)velY=0;
 self.root.rotation.y=yaw+Math.PI;self.walk+=dt*(length>0.1?10:0);const swing=length>.1?Math.sin(self.walk)*.55:0;self.legs[0].rotation.x=swing;self.legs[1].rotation.x=-swing;self.arms[0].rotation.x=-swing*.6;self.arms[1].rotation.x=THREE.MathUtils.lerp(self.arms[1].rotation.x,swing*.6,Math.min(1,dt*10));self.root.rotation.z=down?Math.PI*.44:0;
 const target=new THREE.Vector3(self.root.position.x+Math.sin(yaw)*5*Math.cos(pitch),self.root.position.y+2.7+Math.sin(pitch)*5,self.root.position.z+Math.cos(yaw)*5*Math.cos(pitch));camera.position.lerp(target,Math.min(1,dt*12));camera.lookAt(self.root.position.x,self.root.position.y+1.3,self.root.position.z);
 if(t-lastSend>60){socket.emit('move',{x:self.root.position.x,y:self.root.position.y,z:self.root.position.z,rot:yaw});lastSend=t;}
 }
 for(const [id,p] of players){if(id!==me){p.root.position.lerp(new THREE.Vector3(p.target.x,p.target.y,p.target.z),Math.min(1,dt*12));p.root.rotation.y=p.target.rot+Math.PI;p.root.rotation.z=Date.now()<p.downUntil?Math.PI*.44:0;}p.arms[1].rotation.x=THREE.MathUtils.lerp(p.arms[1].rotation.x,0,Math.min(1,dt*5));}
 if(!self){camera.position.set(0,11,25);camera.lookAt(0,0,0);}renderer.render(scene,camera);
}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
