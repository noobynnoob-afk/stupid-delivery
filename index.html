 if(self&&active){const down=Date.now()<self.downUntil;const mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+stick.x,mz=(keys.KeyW?1:0)-(keys.KeyS?1:0)-stick.y;const length=Math.hypot(mx,mz);const speed=keys.ShiftLeft?7.4:4.5;const sx=length?mx/Math.max(1,length):0,sz=length?mz/Math.max(1,length):0;

 const ground=floorHeight(self.root.position.x,self.root.position.z);if(keys.Space&&self.root.position.y<=ground+.06&&!down)velY=6.2;velY-=17*dt;self.root.position.y=Math.max(ground,self.root.position.y+velY*dt);if(self.root.position.y===ground)velY=0;
 self.root.rotation.y=yaw+Math.PI;self.walk+=dt*(length>0.1?10:0);const swing=length>.1?Math.sin(self.walk)*.55:0;self.legs[0].rotation.x=swing;self.legs[1].rotation.x=-swing;self.arms[0].rotation.x=-swing*.6;self.arms[1].rotation.x=THREE.MathUtils.lerp(self.arms[1].rotation.x,swing*.6,Math.min(1,dt*10));self.root.rotation.z=down?Math.PI*.44:0;
 const target=new THREE.Vector3(self.root.position.x+Math.sin(yaw)*5*Math.cos(pitch),self.root.position.y+2.7+Math.sin(pitch)*5,self.root.position.z+Math.cos(yaw)*5*Math.cos(pitch));const focus=new THREE.Vector3(self.root.position.x,self.root.position.y+1.35,self.root.position.z);const rayDirection=target.clone().sub(focus);const dist=rayDirection.length();rayDirection.normalize();let safe=dist;for(const b of solid){const min=new THREE.Vector3(b.x-b.w/2,b.y0,b.z-b.d/2),max=new THREE.Vector3(b.x+b.w/2,b.y1,b.z+b.d/2);const r=new THREE.Ray(focus,rayDirection),hit=r.intersectBox(new THREE.Box3(min,max),new THREE.Vector3());if(hit)safe=Math.min(safe,Math.max(.9,hit.distanceTo(focus)-.25));}const camTarget=focus.clone().addScaledVector(rayDirection,safe);camera.position.lerp(camTarget,Math.min(1,dt*15));camera.lookAt(focus);

 }
 for(const [id,p] of players){if(id!==me){p.root.position.lerp(new THREE.Vector3(p.target.x,p.target.y,p.target.z),Math.min(1,dt*12));p.root.rotation.y=p.target.rot+Math.PI;p.root.rotation.z=Date.now()<p.downUntil?Math.PI*.44:0;}p.arms[1].rotation.x=THREE.MathUtils.lerp(p.arms[1].rotation.x,0,Math.min(1,dt*5));}
 if(!self){camera.position.set(0,12,26);camera.lookAt(0,2,10);}renderer.render(scene,camera);
}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
